# =====================================================================
#  ProxyGroup.conf  ——  共享策略组（所有设备 / 所有机场通用）
# ---------------------------------------------------------------------
#  本文件不依赖任何外部组名，单独加载也是合法配置（Managed.conf 能通过 URL 校验的前提）。
#
#  节点来源 = 主配置 [Proxy] 段的全部节点（include-all-proxies）
#             主配置用 #!include Sub-A.conf 把机场订阅的 [Proxy] 段引入
#  过滤逻辑 = policy-regex-filter，先排除“剩余流量/到期/官网”及“30 G | 200 G”这类流量数值等信息节点，
#             再按地区关键字归类；六个常见地区以外的全部落入「其他地区」。
#
#  ⚠ 某地区没有任何节点时，该组会回落为 DIRECT（日志显示 SUBSTITUTE），
#    给 AI / 流媒体选组时请确认所选地区确实有节点。
# =====================================================================

[Proxy Group]

# ---------------- 一、总入口 ----------------

节点选择 = select, 自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 韩国节点, 其他地区, 全部节点, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

# 全部可用节点自动择优（Smart 组：按真实连接质量选择，失败自动换下一个）
自动选择 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).+$, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

# 全部节点手动选择（排除信息节点）
全部节点 = select, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).+$, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png

# ---------------- 二、分流用途组（规则引用的都是这些名字） ----------------
AI 服务 = select, 新加坡节点, 美国节点, 日本节点, 台湾节点, 韩国节点, 其他地区, 节点选择, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
流媒体 = select, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 韩国节点, 其他地区, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ForeignMedia.png
Telegram = select, 节点选择, 新加坡节点, 香港节点, 日本节点, 美国节点, 其他地区, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
Google = select, 节点选择, 自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 韩国节点, 其他地区, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
微软服务 = select, DIRECT, 节点选择, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
苹果服务 = select, DIRECT, 节点选择, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
国外网站 = select, 节点选择, 自动选择, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
国内直连 = select, DIRECT, 节点选择, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Domestic.png
广告拦截 = select, REJECT, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png
漏网之鱼 = select, 节点选择, DIRECT, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# ---------------- 三、地区分组（一般无需修改）（smart：组内自动择优，长按可临时手动指定节点） ----------------
# 旧版本（iOS < 5.11 / Mac < 5.7）没有 smart，可把 smart 改为 url-test
香港节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:香港|港|🇭🇰|(?i:hong\s?kong)|(?<![A-Za-z])HKG?(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
台湾节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:台湾|臺灣|台北|新北|彰化|🇹🇼|(?i:taiwan)|(?<![A-Za-z])TWN?(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
日本节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:日本|东京|東京|大阪|🇯🇵|(?i:japan|tokyo|osaka)|(?<![A-Za-z])JPN?(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
新加坡节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:新加坡|狮城|獅城|🇸🇬|(?i:singapore)|(?<![A-Za-z])SGP?(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
美国节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:美国|美國|洛杉矶|圣何塞|硅谷|西雅图|纽约|芝加哥|达拉斯|波特兰|凤凰城|🇺🇸|(?i:united\s?states|los\s?angeles|san\s?jose|seattle|new\s?york)|(?<![A-Za-z])USA?(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
韩国节点 = smart, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$)).*(?:韩国|韓國|首尔|春川|🇰🇷|(?i:korea|seoul)|(?<![A-Za-z])KO?R(?![A-Za-z])), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png

# 常见地区以外的节点（英、德、土、阿根廷……），地区各异，用手动选择
其他地区 = select, include-all-proxies=true, policy-regex-filter=^(?!.*(?:剩余|到期|过期|有效期|官网|网址|地址|重置|流量|套餐|客服|公告|(?i:expire|traffic|reset)|(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?\s?[|/]\s?\d+(?:\.\d+)?\s?[kmgt]i?b?)|^\s*(?i:\d+(?:\.\d+)?\s?[kmgt]i?b?)\s*$|香港|港|🇭🇰|(?i:hong\s?kong)|(?<![A-Za-z])HKG?(?![A-Za-z])|台湾|臺灣|台北|新北|彰化|🇹🇼|(?i:taiwan)|(?<![A-Za-z])TWN?(?![A-Za-z])|日本|东京|東京|大阪|🇯🇵|(?i:japan|tokyo|osaka)|(?<![A-Za-z])JPN?(?![A-Za-z])|新加坡|狮城|獅城|🇸🇬|(?i:singapore)|(?<![A-Za-z])SGP?(?![A-Za-z])|美国|美國|洛杉矶|圣何塞|硅谷|西雅图|纽约|芝加哥|达拉斯|波特兰|凤凰城|🇺🇸|(?i:united\s?states|los\s?angeles|san\s?jose|seattle|new\s?york)|(?<![A-Za-z])USA?(?![A-Za-z])|韩国|韓國|首尔|春川|🇰🇷|(?i:korea|seoul)|(?<![A-Za-z])KO?R(?![A-Za-z]))).+$, icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/World_Map.png

