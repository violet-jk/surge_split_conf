# =====================================================================
#  Main.conf  ——  主配置（每个机场 / 每台设备复制一份，只改「订阅」部分）
# ---------------------------------------------------------------------
#  文件布局（放在同一个 Surge 配置目录，如 iCloud Drive/Surge）：
#    Main.conf          ← 本文件：订阅 + include 语句 + 设备私有段
#    General.dconf      ← [General]      共享
#    ProxyGroup.dconf   ← [Proxy Group]  共享（地区分组 + 用途分组）
#    Rule.dconf         ← [Rule]         共享
#  .dconf 不是完整配置，不会出现在 Surge 的配置列表里。
#
#  版本要求：[Proxy Group] / [Rule] 中「本地内容 + #!include 混写」需要
#            Surge iOS 5.22.0+ / Mac 6.9.0+；Smart 组需要 iOS 5.11+ / Mac 5.7+。
#            更旧版本的写法见各段注释。
# =====================================================================

[General]
#!include General.dconf

[Proxy]
# 自建 / 单独购买的节点写在这里（可选），会被自动按地区归入各分组。
# 例：🇯🇵 自建-东京 = ss, 1.2.3.4, 8388, encrypt-method=aes-128-gcm, password=xxx

[Proxy Group]
# ========================= 订阅部分（唯一需要修改的地方）=========================
# 共享文件只认组名「订阅」，地址随意换。
订阅 = select, policy-path=https://example.com/your-subscription?target=surge, update-interval=43200, hidden=true

# --- 多个机场时：每个机场一组（加前缀防止重名），再由「订阅」汇总 ---
# 机场A = select, policy-path=https://a.example.com/sub, update-interval=43200, external-policy-name-prefix=A·, hidden=true
# 机场B = select, policy-path=https://b.example.com/sub, update-interval=43200, external-policy-name-prefix=B·, hidden=true
# 订阅 = select, include-other-group="机场A,机场B", hidden=true

# --- 订阅链接只有几分钟时效时：下载一次存成本地文件，policy-path 指向本地路径 ---
# （路径相对于配置目录；文件可以是节点列表，也可以是含 [Proxy] 段的完整配置）
# 订阅 = select, policy-path=Sub-A.list, hidden=true
# 机场更换服务器或密码后，重新下载覆盖 Sub-A.list 即可
# ===============================================================================
#!include ProxyGroup.dconf

# 旧版本（不支持混写）：把上面的订阅行单独存成 Sub-xxx.dconf（含 [Proxy Group] 头），
# 然后本段只写一行：  #!include Sub-xxx.dconf, ProxyGroup.dconf

[Rule]
# 个人规则写在 include 之前（优先级最高）；写在之后的不会生效（Rule.dconf 以 FINAL 结尾）
# DOMAIN-SUFFIX,example.com,🚀 节点选择
#!include Rule.dconf

[MITM]
# CA 证书与设备相关，留在主配置里，不放进共享文件
