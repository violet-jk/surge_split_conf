# =====================================================================
#  Main.conf  ——  主配置（每台设备一份，设为 Surge 的当前配置）
# ---------------------------------------------------------------------
#  文件布局（全部放在同一个 Surge 配置目录）：
#    Main.conf      ← 本文件：只有 include 语句，基本不用改
#    Managed.conf   ← 共享的 [General] [Proxy Group] [Rule]，托管配置，按 URL 自动更新
#    Sub-A.conf     ← 机场订阅（取其 [Proxy] 段），本地留存，不进仓库
#    MITM.conf      ← [MITM] CA 证书，本地生成，不进仓库
#
#  ── 首次部署（按顺序）──────────────────────────────────────────
#  1. Surge → 从 URL 下载配置：
#       https://raw.githubusercontent.com/violet-jk/surge_split_conf/main/Managed.conf
#     下载后在配置列表里确认文件名为 Managed.conf（不是则重命名），不要把它设为当前配置。
#  2. 把机场订阅存为 Sub-A.conf（机场下发的完整 Surge 配置即可；纯节点列表需在首行加 [Proxy]）。
#  3. 新建 MITM.conf，内容只写一行：[MITM]
#  4. 最后再导入本文件（可从 URL 下载一次），设为当前配置。
#     前 3 个文件不存在时导入本文件会校验失败（例如“规则必须以 FINAL 结尾”）。
#
#  ── 日常更新 ──────────────────────────────────────────────────
#  只需修改仓库里的 General.conf / ProxyGroup.conf / Rule.conf 并推送，
#  GitHub Actions 会重新生成 Managed.conf，各设备上的 Surge 按 interval 自动拉取。
#
#  Surge Mac 6.0+ 可省略第 1 步：把下面三处 Managed.conf 直接换成上面的 URL。
#  版本要求：Smart 组需要 iOS 5.11+ / Mac 5.7+；同一段里「本地内容 + include」混写需要 iOS 5.22+ / Mac 6.9+。
# =====================================================================

[General]
#!include Managed.conf

[Proxy]
# 机场节点；多个机场：#!include Sub-A.conf, Sub-B.conf（各机场节点不能重名）
# 自建节点可另起一行写在 include 下方（需支持混写的版本），会被自动按地区归入各分组。
#!include Sub-A.conf

[Proxy Group]
#!include Managed.conf

[Rule]
# 个人规则写在 include 之前（优先级最高；需支持混写的版本）；写在之后的不会生效（共享规则以 FINAL 结尾）
# DOMAIN-SUFFIX,example.com,节点选择
#!include Managed.conf

[MITM]
# MITM.conf 存放 CA 证书与私钥（ca-p12 / ca-passphrase），每台设备各自生成，已在 .gitignore 中排除，切勿提交。
# 只有这一行 include 时，在 UI 中生成证书、修改 hostname 会直接写回 MITM.conf，本文件保持干净。
#!include MITM.conf
