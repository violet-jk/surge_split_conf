# =====================================================================
#  Rule.conf  ——  共享分流规则（所有设备 / 所有机场通用）
# ---------------------------------------------------------------------
#  · 规则只引用 ProxyGroup.conf 中的「用途组」名字，不直接引用节点或地区，
#    所以换机场、换地区都不需要动规则。
#  · 规则集来源：
#      blackmatrix7/ios_rule_script  （按服务划分的 RULE-SET）
#      Loyalsoldier/surge-rules       （国内/国外/广告大列表，DOMAIN-SET）
#  · 含 IP 规则的服务列表加了 no-resolve，避免它们排在前面时触发 DNS 解析。
#  · 本文件以 FINAL 结尾：主配置里写在 #!include 之后的规则永远不会生效。
# =====================================================================

[Rule]

# ---------------- 系统与局域网 ----------------
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT,no-resolve

# ---------------- 广告拦截 ----------------
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/reject.txt,广告拦截

# ---------------- AI 服务 ----------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list,AI 服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list,AI 服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list,AI 服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Copilot/Copilot.list,AI 服务,no-resolve

# ---------------- 流媒体 ----------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,YouTube,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Netflix/Netflix.list,流媒体,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Disney/Disney.list,流媒体,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,流媒体,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TikTok/TikTok.list,流媒体,no-resolve

# ---------------- 常用服务 ----------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,微软服务,no-resolve
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/icloud.txt,苹果服务
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/apple.txt,苹果服务

# ---------------- 国外 / 国内大列表 ----------------
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt,国外网站
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt,国内直连

# ---------------- IP 类规则（从这里开始会触发 DNS 解析） ----------------
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/telegramcidr.txt,Telegram
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/cncidr.txt,国内直连
GEOIP,CN,国内直连

# ---------------- 兜底 ----------------
# dns-failed：DNS 解析失败时仍按 FINAL 策略走代理，避免被污染的域名直接失败
FINAL,漏网之鱼,dns-failed
